  </g>

  <!-- headline -->
  <text class="h" x="56" y="192">Automate anything.</text>
  <text class="h" x="56" y="250">Build everything.</text>
  <text class="h" x="56" y="308" fill="url(#gt)">Inside WordPress.</text>
  <text class="sub" x="56" y="358">The AI-native automation platform for WordPress.</text>
  <text class="sub2" x="56" y="388">Unlimited runs. No per-task fees. Your own server.</text>

  <!-- workflow canvas -->
  <g transform="translate(640 44)">
    <rect width="504" height="372" rx="22" fill="#12141F" fill-opacity=".94" stroke="#fff" stroke-opacity=".09"/>
    <rect width="504" height="372" rx="22" fill="url(#dots)"/>
    <text class="name" x="24" y="35">New order to Slack and Sheets</text>
    <g transform="translate(418 20)">
      <rect width="62" height="22" rx="11" fill="#22C55E" fill-opacity=".14" stroke="#22C55E" stroke-opacity=".45"/>
      <circle cx="13" cy="11" r="3.5" fill="#22C55E"/>
      <text class="on" x="23" y="15">Live</text>
    </g>

    <!-- wires -->
    <path class="wire" d="M100 200H170"/>
    <path class="wire" d="M230 200H300"/>
    <path class="wire" d="M360 200C400 200 400 120 420 120"/>
    <path class="wire" d="M360 200C400 200 400 280 420 280"/>

    <!-- data pulses (under the nodes) -->
    <circle class="pulse" r="4" fill="#fff" filter="url(#glow)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M100 200H360C400 200 400 120 420 120" calcMode="linear"/>
    </circle>
    <circle class="pulse" r="4" fill="#fff" filter="url(#glow)">
      <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M100 200H360C400 200 400 280 420 280" calcMode="linear"/>
    </circle>

    <!-- trigger: new order -->
    <g transform="translate(40 170)">
      <rect width="60" height="60" rx="16" fill="#1A1D2E" stroke="#fff" stroke-opacity=".12"/>
      <g transform="translate(18 18)" class="ico" stroke="#60A5FA"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g>
      <text class="lbl" x="30" y="80">New order</text>
    </g>
    <!-- AI agent -->
    <g transform="translate(170 170)">
      <rect x="-6" y="-6" width="72" height="72" rx="20" fill="#8B5CF6" fill-opacity=".45" filter="url(#soft)"/>
      <rect width="60" height="60" rx="16" fill="#1A1D2E" stroke="#A78BFA" stroke-opacity=".7"/>
      <g transform="translate(18 18)" class="ico" stroke="#C4B5FD"><path d="M11 3l1.7 4.8L17.5 9.5l-4.8 1.7L11 16l-1.7-4.8L4.5 9.5l4.8-1.7z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g>
      <text class="lbl" x="30" y="80">AI Agent</text>
    </g>
    <!-- router -->
    <g transform="translate(300 170)">
      <rect width="60" height="60" rx="16" fill="#1A1D2E" stroke="#fff" stroke-opacity=".12"/>
      <g transform="translate(18 18)" class="ico" stroke="#4FD6E6"><path d="M3 12h5"/><path d="M8 12c4 0 4-6 8-6h4"/><path d="M8 12c4 0 4 6 8 6h4"/><path d="M18 4l2 2-2 2"/><path d="M18 16l2 2-2 2"/></g>
      <text class="lbl" x="30" y="80">Router</text>
    </g>
    <!-- slack -->
    <g transform="translate(420 90)">
      <rect width="60" height="60" rx="16" fill="#1A1D2E" stroke="#fff" stroke-opacity=".12"/>
      <g transform="translate(18 18)" class="ico" stroke="#F5F7FC"><path d="M10 3 8 21"/><path d="M16 3l-2 18"/><path d="M4 9h17"/><path d="M3 15h17"/></g>
      <text class="lbl" x="30" y="80">Slack</text>
    </g>
    <!-- sheets -->
    <g transform="translate(420 250)">
      <rect width="60" height="60" rx="16" fill="#1A1D2E" stroke="#fff" stroke-opacity=".12"/>
      <g transform="translate(18 18)" class="ico" stroke="#F5F7FC"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M3 15h18"/><path d="M10 4v16"/></g>
      <text class="lbl" x="30" y="80">Google Sheets</text>
    </g>
  </g>
</svg>

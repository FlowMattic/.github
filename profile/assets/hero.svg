<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t">
  <title id="t">FlowMattic. Automate anything. Build everything. Inside WordPress.</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="460" rx="28"/></clipPath>
    <radialGradient id="glowBlue" cx="0.16" cy="0.02" r="0.62"><stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowViolet" cx="0.9" cy="0.12" r="0.58"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="1.05" r="0.5"><stop offset="0" stop-color="#4FD6E6" stop-opacity=".2"/><stop offset="1" stop-color="#4FD6E6" stop-opacity="0"/></radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.1" r="0.85"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".08"/></pattern>
    <mask id="gridfade"><rect width="1200" height="460" fill="url(#fade)"/></mask>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="H"><path d="M 198.3 198.3 A 74 74 0 0 1 93.7 93.7 Z"/></clipPath>
    <mask id="MS" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#000"/>
      <g fill="none" stroke="#fff" stroke-width="24"><rect x="68" y="68" width="84" height="84" rx="24"/></g>
      <g fill="none" stroke="#000" stroke-width="38"><circle cx="146" cy="146" r="42"/></g>
      <g clip-path="url(#H)"><g fill="none" stroke="#fff" stroke-width="24"><rect x="68" y="68" width="84" height="84" rx="24"/></g></g>
    </mask>
    <mask id="MC" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#000"/>
      <g fill="none" stroke="#fff" stroke-width="24"><circle cx="146" cy="146" r="42"/></g>
      <g clip-path="url(#H)"><g fill="none" stroke="#000" stroke-width="38"><rect x="68" y="68" width="84" height="84" rx="24"/></g></g>
    </mask>
    <style>
      .h{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:50px;letter-spacing:-1.2px;fill:#F5F7FC}
      .sub{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:19px;fill:#AAB4D9}
      .sub2{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:16px;fill:#7E88B0}
      .lbl{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:12.5px;fill:#C7CEEA;text-anchor:middle}
      .name{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:12.5px;fill:#C7CEEA}
      .on{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:10.5px;fill:#86EFAC}
      .ico{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .wire{fill:none;stroke:#96A3D6;stroke-opacity:.5;stroke-width:1.8;stroke-dasharray:2 5;stroke-linecap:round}
      @media (prefers-reduced-motion:reduce){.pulse{display:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#0A0B12"/>
    <rect width="1200" height="460" fill="url(#glowBlue)"/>
    <rect width="1200" height="460" fill="url(#glowViolet)"/>
    <rect width="1200" height="460" fill="url(#glowCyan)"/>
    <rect width="1200" height="460" fill="url(#grid)" mask="url(#gridfade)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="28" fill="none" stroke="#fff" stroke-opacity=".09"/>

  <!-- logo lockup -->
  <g transform="translate(56 46) scale(0.4)">
    <g transform="translate(-2.444 -2.444) scale(0.59722)">
      <rect width="256" height="256" fill="#FFFFFF" mask="url(#MC)"/>
      <rect width="256" height="256" fill="#FFFFFF" mask="url(#MS)"/>
    </g>
